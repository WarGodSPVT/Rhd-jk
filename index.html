<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Log In</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#36393f; --field:#202225; --text:#fff; --muted:#b9bbbe; --ph:#a3a6aa;
  --link:#00a8fc; --brand:#5865f2; --brand-hover:#4752c4; --shape:rgba(255,255,255,.03);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#36393f;--field:#202225;--text:#fff;--muted:#b9bbbe;--ph:#a3a6aa}}
:root[data-theme="dark"]{--bg:#36393f;--field:#202225;--text:#fff;--muted:#b9bbbe;--ph:#a3a6aa}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);
  font-family:"Noto Sans","gg sans",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex;justify-content:center;overflow-x:hidden}
.screen{position:relative;width:100%;max-width:420px;min-height:100vh;padding:0 12px;overflow:hidden}
.shape{position:absolute;background:var(--shape);pointer-events:none}
.s1{width:120px;height:120px;transform:rotate(45deg);left:20px;top:60px;border-radius:6px}
.s2{width:80px;height:200px;right:-10px;top:8px;border-radius:40px 10px 30px 40px;transform:rotate(-8deg)}
.s3{width:82px;height:82px;border-radius:50%;right:-6px;top:315px}
.s4{width:70px;height:60px;left:92px;top:268px}
.back{position:relative;display:flex;align-items:center;gap:8px;padding:14px 0 0;
  background:none;border:0;color:var(--text);font:inherit;font-size:15px;font-weight:500;cursor:pointer}
.back svg{width:10px;height:16px}
h1{position:relative;margin:6px 0 0;text-align:center;font-size:23px;font-weight:700;letter-spacing:-.2px}
.sub{position:relative;margin:14px 0 0;text-align:center;font-size:14px;color:var(--muted)}
form{position:relative}
label.cap{display:block;margin:36px 0 8px;font-size:12px;font-weight:700;letter-spacing:.2px;text-transform:uppercase;color:var(--muted)}
.field{position:relative;margin-bottom:8px}
.field input{width:100%;height:43px;padding:0 48px 0 12px;background:var(--field);color:var(--text);
  border:0;border-radius:4px;font:inherit;font-size:16px;outline:2px solid transparent;outline-offset:0}
.field input::placeholder{color:var(--ph)}
.field input:focus{outline-color:var(--brand)}
.eye{position:absolute;right:0;top:0;height:43px;width:48px;background:none;border:0;color:#b9bbbe;cursor:pointer;display:grid;place-items:center}
.eye svg{width:22px;height:22px}
.forgot{display:inline-block;margin:6px 0 20px;font-size:13px;color:var(--link);text-decoration:none}
.forgot:hover{text-decoration:underline}
.login{width:100%;height:36px;border:0;border-radius:3px;background:var(--brand);color:#fff;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.login:hover{background:var(--brand-hover)}
.login:active{transform:scale(.99)}
</style>
</head>
<body>
<main class="screen">
  <div class="shape s1"></div><div class="shape s2"></div><div class="shape s3"></div><div class="shape s4"></div>

  <button class="back" type="button" onclick="history.back()">
    <svg viewBox="0 0 10 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 1.5 2 8l6.5 6.5"/></svg>
    Back
  </button>

  <h1>Welcome back!</h1>
  <p class="sub">We’re so excited to see you again!</p>

  <form id="loginForm">
    <label class="cap" for="id">Account Information</label>
    <div class="field"><input id="id" type="text" placeholder="Email or Phone Number" autocomplete="username"></div>
    <div class="field">
      <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
      <button class="eye" type="button" id="eye" aria-label="Show password">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 5C6.5 5 2.7 8.6 1 12c1.7 3.4 5.5 7 11 7s9.3-3.600 11-7c-1.700-3.400-5.500-7-11-7Zm0 11.200a4.200 4.200 0 1 1 0-8.400 4.200 4.200 0 0 1 0 8.400Z"/><circle cx="12" cy="12" r="2.200" fill="#202225"/></svg>
      </button>
    </div>
    <a class="forgot" href="#">Forgot your password?</a>
    <p id="msg" style="min-height:18px;margin:0 0 8px;font-size:13px;color:#f87171"></p>
    <button class="login" type="submit">Log In</button>
  </form>
</main>
<script>
var pw=document.getElementById('pw');
document.getElementById('eye').addEventListener('click',function(){
  var show=pw.type==='password';
  pw.type=show?'text':'password';
  this.setAttribute('aria-label',show?'Hide password':'Show password');
});

// Point this at your deployed backend URL
var API_BASE = '';

var form = document.getElementById('loginForm');
var msg = document.getElementById('msg');

form.addEventListener('submit', async function(e){
  e.preventDefault();
  msg.textContent = '';
  var identifier = document.getElementById('id').value.trim();
  var password = pw.value;

  if (!identifier || !password) {
    msg.textContent = 'Please fill in both fields.';
    return;
  }

  try {
    var res = await fetch(API_BASE + '/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ identifier: identifier, password: password })
    });
    var data = await res.json();
    if (!res.ok) {
      msg.textContent = data.error || 'Login failed.';
      return;
    }
    msg.style.color = '#4ade80';
    msg.textContent = 'Logged in as ' + data.user.identifier;
  } catch (err) {
    msg.textContent = 'Could not reach the server.';
  }
});
</script>
</body>
</html>
